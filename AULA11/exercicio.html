<!-- EXERCÍCIO 06 — AUTO-FIT
Substitua as Media Queries da grade por:

repeat(
auto-fit,
minmax(220px, 1fr)
)

OBS: Compare as duas soluções. -->

<!-- .grid-exercicio {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
} -->

<!-- RESPOSTA: Media Queries: Dependem de pontos de interrupção fixos baseados na largura da janela, ex: 900 e 1024.

Auto-fit + Minmax: Solução de layout fluido sem media queries que ajusta e distribui automaticamente as colunas de no mínimo 220px conforme a largura da tela.
